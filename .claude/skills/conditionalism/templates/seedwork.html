<title>Seedwork</title>
<style>
  /* Layout: the drawing fills a square; the given is printed beneath it as the title. */
  :root {
    --bg: #edefe9; --fg: #1a1f1c; --dim: #56605a; --line: #c4cbbf; --mark: #2c46b8;
    --display: "Bodoni Moda", Didot, Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121512; --fg: #e3e6dc; --dim: #9aa196; --line: #343a35; --mark: #8ea2ff; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #121512; --fg: #e3e6dc; --dim: #9aa196; --line: #343a35; --mark: #8ea2ff; color-scheme: dark; }
  body { background: var(--bg); color: var(--fg); margin: 0; padding-block: 24px; padding-inline: 16px; font-family: var(--mono); }
  main { max-width: 640px; margin-inline: auto; display: grid; gap: 12px; }
  canvas { width: 100%; max-width: 100%; aspect-ratio: 1; display: block; border: 1px solid var(--line); }
  .given { font-size: 13px; color: var(--dim); overflow-wrap: anywhere; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, input { font: inherit; font-size: 12px; padding: 6px 10px; border: 1px solid var(--fg); background: var(--bg); color: var(--fg); }
  button:hover { border-color: var(--mark); color: var(--mark); }
  :focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
</style>

<main>
  <canvas id="c" width="1200" height="1200" role="img" aria-label="Seeded drawing"></canvas>
  <p class="given" id="given"></p>
  <div class="row">
    <label for="seed">seed</label>
    <input id="seed" size="14">
    <button id="next" type="button">Next seed</button>
  </div>
</main>

<script>
  // THE GIVEN: edit these lines first. They are printed on the piece (tenet T1).
  const PROMPT = "Chords on a circle, as many as the seed allows; the heaviest in blue.";
  const PARAMS = { points: 24, chords: 18 };

  function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.codePointAt(0), 16777619); return h >>> 0; }
  function rng(a) { return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  function draw(seed) {
    const r = rng(hash(seed));
    const cv = document.getElementById("c"), g = cv.getContext("2d"), S = cv.width, C = S / 2, R = S * 0.42;
    g.fillStyle = css("--bg"); g.fillRect(0, 0, S, S);
    const pt = (i) => [C + R * Math.cos(-Math.PI / 2 + (i / PARAMS.points) * 2 * Math.PI), C + R * Math.sin(-Math.PI / 2 + (i / PARAMS.points) * 2 * Math.PI)];
    g.strokeStyle = css("--line"); g.lineWidth = 2; g.beginPath(); g.arc(C, C, R, 0, 2 * Math.PI); g.stroke();
    const n = 3 + Math.floor(r() * PARAMS.chords);
    for (let k = 0; k < n; k++) {
      const [x1, y1] = pt(Math.floor(r() * PARAMS.points)), [x2, y2] = pt(Math.floor(r() * PARAMS.points));
      const last = k === n - 1;
      g.strokeStyle = last ? css("--mark") : css("--fg"); g.globalAlpha = last ? 1 : 0.25 + 0.6 * r(); g.lineWidth = last ? 6 : 1 + 4 * r();
      g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo(C, C, x2, y2); g.stroke();
    }
    g.globalAlpha = 1;
    document.getElementById("given").textContent = `given “${PROMPT}” · ${JSON.stringify(PARAMS)} · seed #${seed}`;
    document.getElementById("seed").value = seed;
  }

  // Seeds travel as a bare hash token, the only hash form an Artifact page receives.
  const fromHash = () => decodeURIComponent(location.hash.slice(1)) || "1";
  const go = (s) => { try { history.replaceState(null, "", "#" + encodeURIComponent(s)); } catch {} draw(s); };
  document.getElementById("next").onclick = () => go(String((parseInt(fromHash(), 10) || 0) + 1));
  document.getElementById("seed").onchange = (e) => go(e.target.value.replace(/[^\w.~-]/g, "") || "1");
  window.addEventListener("hashchange", () => draw(fromHash()));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw(fromHash()));
  draw(fromHash());
</script>
