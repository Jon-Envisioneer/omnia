r-engineering",name:"Stellar-Scale Engineering",realm:"cosmos",horizon:"deep",reach:8,strange:95,essence:"Harnessing a meaningful fraction of a star's energy output, the transition Kardashev described.",gift:"Energy on a scale that turns civilisational problems into design problems.",seeds:["space-based solar power demonstrations","Dyson swarm thought experiments","SETI searches for technosignatures"],shadow:"The waste heat and ambition of a species that forgot limits.",question:"What would a star-scale civilisation still find hard?"},{id:"post-work-vocation",name:"Post-Work Vocation",realm:"meaning",horizon:"far",reach:40,strange:60,essence:"Meaning, identity and dignity decoupled from paid employment.",gift:"People answer 'what do you do?' with what they love or tend.",seeds:["automation of routine cognitive work","basic income experiments","the rise of craft, volunteering and amateur science"],shadow:"Without the structure of work, meaning can collapse into distraction.",question:"What would you introduce yourself as if you never needed to earn again?"},{id:"secular-ritual",name:"Secular Ritual Design",realm:"meaning",horizon:"now",reach:70,strange:42,essence:"Consciously designed rituals for thresholds that tradition never covered.",gift:"Grace around first AI companions, digital deaths, gender transitions and climate grief.",seeds:["death doulas and death cafés","humanist ceremonies","climate grief circles"],shadow:"Rituals designed in a workshop can feel hollow.",question:"Design a ritual for deleting a friend's account after they die."},{id:"digital-afterlives",name:"Digital Afterlives",realm:"meaning",horizon:"now",reach:70,strange:65,essence:"Models trained on the dead that let the living keep talking with them.",gift:"Grief that continues a conversation, with family memory preserved in voices.",seeds:["griefbots","AI voice cloning","legacy settings on social platforms"],shadow:"Grief that can never end, and a dead person's likeness licensed by a company.",question:"What would you forbid a model of you to say after you die?"},{id:"awe-engineering",name:"Awe Engineering",realm:"meaning",horizon:"near",reach:55,strange:50,essence:"Designing for awe as a public-health intervention.",gift:"Awe reduces self-focus and increases generosity; making it common could change civic life.",seeds:["overview-effect research on astronauts","awe-walk studies","dark-sky reserves"],shadow:"Awe can be weaponised by those who stage spectacle.",question:"What is the most awe-inducing thing within a 10-minute walk of you?"},{id:"deep-time-myth",name:"Deep-Time Mythology",realm:"meaning",horizon:"far",reach:35,strange:65,essence:"New shared stories sized to cosmology, evolution and deep futures.",gift:"A sense of belonging to a 13.8-billion-year story rather than a single news cycle.",seeds:["Big History curricula","the Universe Story movement","cosmic-scale science communication"],shadow:"Grand narratives have a history of crushing small ones.",question:"Tell the origin story of humanity from the viewpoint of carbon."},{id:"latent-cartography",name:"Latent Cartography",realm:"latent",horizon:"now",reach:80,strange:70,essence:"Navigating the internal representation spaces of models as terrain of unrealised ideas, styles and concepts.",gift:"The possible becomes something you can survey, walk and point at, not just imagine.",seeds:["sparse autoencoder feature maps","embedding-space exploration tools","steering vectors"],shadow:"A map of a model's latent space describes the model's biases, not the world's full range.",question:"What lies halfway between 'lullaby' and 'tax law'?"},{id:"concept-synthesis",name:"Concept Synthesis",realm:"latent",horizon:"near",reach:55,strange:75,essence:"Inventing useful concepts that no human language yet has a word for, then naming and testing them.",gift:"New words for real experiences, and new tools for thinking.",seeds:["The Dictionary of Obscure Sorrows","features in models that have no human label","loanwords like hygge and saudade spreading globally"],shadow:"A flood of invented concepts dilutes the useful ones.",question:"Name a feeling you've had that has no word."},{id:"co-evolution",name:"Human–Model Co-Evolution",realm:"latent",horizon:"now",reach:85,strange:55,essence:"Humans and models shape each other's language, taste and thought in a continuous loop.",gift:"A new partner in culture, if the loop is kept diverse and honest.",seeds:["models trained on human text, then shaping human text","writing styles converging on model defaults","agent harnesses that improve themselves"],shadow:"Monoculture: everyone and everything starts to sound the same.",question:"How would you notice if your taste had been shaped by a model?"},{id:"adjacent-possible-commons",name:"The Adjacent Possible Commons",realm:"latent",horizon:"near",reach:50,strange:62,essence:"A public, living map of what is one step away from possible, in Stuart Kauffman's sense, in every field.",gift:"Innovation that is less random and less captured, because anyone can see where the next doors are.",seeds:["Kauffman's adjacent-possible theory","patent landscaping","open research roadmaps"],shadow:"A map of the next doors is also a map for whoever wants to lock them.",question:"What is one step away from possible in your field right now?"},{id:"ontological-engineering",name:"Ontological Engineering",realm:"latent",horizon:"far",reach:35,strange:85,essence:"Deliberately designing new categories of being with their own rights, duties and forms of existence.",gift:"Room in the world for entities that don't fit today's categories: DAOs, digital minds, river-persons, human–AI hybrids.",seeds:["corporate personhood","legal personality for ecosystems","debates over AI moral status"],shadow:"New categories can be created to escape responsibilities under the old ones.",question:"Invent a new kind of being and write its first right."}],P=[{id:"invert",name:"Invert",move:"Reverse who acts and who is acted upon.",claus
